<script>
  let CURRENT_USER = null;

  /**
   * Định dạng 1 Date thành 'yyyy-MM-dd' theo GIỜ ĐỊA PHƯƠNG của trình duyệt.
   * KHÔNG dùng toISOString() cho việc này vì nó quy đổi sang giờ UTC —
   * ở múi giờ Việt Nam (UTC+7), điều đó khiến ngày bị lùi 1 hôm mỗi khi
   * thời điểm tạo Date rơi vào khoảng 00:00-06:59 giờ địa phương (ví dụ
   * new Date(năm, tháng, 1) luôn là 00:00 địa phương nên luôn bị lùi).
   */
  function _localDateStr(d) {
    const y = d.getFullYear();
    const m = String(d.getMonth() + 1).padStart(2, '0');
    const day = String(d.getDate()).padStart(2, '0');
    return y + '-' + m + '-' + day;
  }

  const ROLE_MENUS = {
    ADMIN: ['dashboard', 'thu', 'chi', 'soquy', 'soquycongdoan', 'socom', 'doisoat', 'congno', 'doituong', 'danhmuc', 'baocao', 'tracuu', 'quantri', 'huongdan'],
    THU_QUY: ['dashboard', 'thu', 'chi', 'soquy', 'soquycongdoan', 'socom', 'doisoat', 'tracuu', 'huongdan'],
    XEM: ['dashboard', 'soquy', 'soquycongdoan', 'socom', 'doisoat', 'congno', 'baocao', 'tracuu', 'huongdan']
  };

  function currentUserInfo() {
    return { username: CURRENT_USER.username, full_name: CURRENT_USER.full_name };
  }

  /* ================= CACHE DANH MỤC PHÍA TRÌNH DUYỆT ================= */
  let CACHED_FORM_OPTIONS = null;
  let CACHED_FORM_OPTIONS_TIME = 0;
  const FORM_OPTIONS_CACHE_MS = 60000;

  function getFormOptionsCached(onSuccess, forceRefresh) {
    const now = Date.now();
    if (!forceRefresh && CACHED_FORM_OPTIONS && (now - CACHED_FORM_OPTIONS_TIME) < FORM_OPTIONS_CACHE_MS) {
      onSuccess(CACHED_FORM_OPTIONS);
      return;
    }
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { alert('Lỗi: ' + res.message); return; }
        CACHED_FORM_OPTIONS = res.data;
        CACHED_FORM_OPTIONS_TIME = Date.now();
        onSuccess(res.data);
      })
      .withFailureHandler(function (err) { alert('Lỗi hệ thống: ' + err.message); })
      .getFormOptions();
  }

  /* ================= ĐĂNG NHẬP ================= */
  document.addEventListener('DOMContentLoaded', function () {
    const saved = sessionStorage.getItem('current_user');
    if (saved) {
      CURRENT_USER = JSON.parse(saved);
      showApp();
    }

    document.getElementById('btnLogin').addEventListener('click', doLogin);
    document.getElementById('loginPassword').addEventListener('keydown', function (e) {
      if (e.key === 'Enter') doLogin();
    });
  });

  function doLogin() {
    const username = document.getElementById('loginUsername').value.trim();
    const password = document.getElementById('loginPassword').value;
    const errBox = document.getElementById('loginError');
    errBox.classList.add('hidden');

    if (!username || !password) {
      errBox.textContent = 'Vui lòng nhập đầy đủ Tên đăng nhập và Mật khẩu.';
      errBox.classList.remove('hidden');
      return;
    }

    const btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Đang kiểm tra...';

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
        if (!res.success) {
          errBox.textContent = res.message;
          errBox.classList.remove('hidden');
          return;
        }
        CURRENT_USER = res.data;
        sessionStorage.setItem('current_user', JSON.stringify(CURRENT_USER));
        showApp();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = 'Đăng nhập';
        errBox.textContent = 'Lỗi hệ thống: ' + err.message;
        errBox.classList.remove('hidden');
      })
      .loginUser(username, password);
  }

  function doLogout() {
    sessionStorage.removeItem('current_user');
    CURRENT_USER = null;
    CACHED_FORM_OPTIONS = null;
    document.getElementById('appShell').style.display = 'none';
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('loginUsername').value = '';
    document.getElementById('loginPassword').value = '';
  }

  function showApp() {
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('appShell').style.display = 'flex';
    document.getElementById('userFullName').textContent = CURRENT_USER.full_name;
    document.getElementById('userRole').textContent = CURRENT_USER.role;
    applyRoleMenuVisibility();
    switchMenu('dashboard');
  }

  function applyRoleMenuVisibility() {
    const allowed = ROLE_MENUS[CURRENT_USER.role] || ROLE_MENUS['XEM'];
    document.querySelectorAll('.menu-item').forEach(function (el) {
      el.style.display = allowed.indexOf(el.dataset.menu) === -1 ? 'none' : '';
    });
  }

  /* ================= MENU / ĐIỀU HƯỚNG ================= */
  const MENU_TITLES = {
    dashboard: 'Dashboard',
    thu: 'Thu Tiền',
    chi: 'Chi Tiền',
    soquy: 'Sổ Quỹ',
    soquycongdoan: 'Sổ Quỹ Công Đoàn',
    socom: 'Sổ Cơm',
    doisoat: 'Sổ Đối Soát',
    congno: 'Công Nợ',
    doituong: 'Đối Tượng',
    danhmuc: 'Danh Mục',
    baocao: 'Báo Cáo',
    tracuu: 'Tra Cứu',
    quantri: 'Quản Trị',
    huongdan: 'Hướng Dẫn Sử Dụng'
  };

  function switchMenu(key) {
    const allowed = ROLE_MENUS[CURRENT_USER.role] || ROLE_MENUS['XEM'];
    if (allowed.indexOf(key) === -1) {
      alert('Tài khoản "' + CURRENT_USER.role + '" không có quyền truy cập chức năng này.');
      key = 'dashboard';
    }

    document.querySelectorAll('.menu-item').forEach(el => el.classList.toggle('active', el.dataset.menu === key));
    document.getElementById('pageTitle').textContent = MENU_TITLES[key] || key;

    if (key === 'dashboard') {
      renderDashboardPlaceholder();
      loadDashboard();
    } else if (key === 'thu') {
      renderThuForm();
    } else if (key === 'chi') {
      renderChiForm();
    } else if (key === 'soquy') {
      renderSoQuy();
    } else if (key === 'soquycongdoan') {
      renderSoQuyCongDoan();
    } else if (key === 'socom') {
      renderSoCom();
    } else if (key === 'doisoat') {
      renderSoDoiSoat();
    } else if (key === 'congno') {
      renderCongNo();
    } else if (key === 'baocao') {
      renderBaoCao();
    } else if (key === 'quantri') {
      renderQuanTri();
    } else if (key === 'doituong') {
      renderDoiTuong();
    } else if (key === 'danhmuc') {
      renderDanhMuc();
    } else if (key === 'tracuu') {
      renderTraCuu();
    } else if (key === 'huongdan') {
      renderHuongDan();
    } else {
      renderComingSoon(MENU_TITLES[key]);
    }

    closeSidebarMobile();
  }

  function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
    document.getElementById('sidebarBackdrop').classList.toggle('hidden');
  }

  function closeSidebarMobile() {
    document.getElementById('sidebar').classList.remove('open');
    document.getElementById('sidebarBackdrop').classList.add('hidden');
  }

  function renderComingSoon(title) {
    document.getElementById('mainContent').innerHTML = `
      <div class="card text-center text-gray-400 py-16">
        <div class="text-4xl mb-3">🚧</div>
        <div class="font-medium text-gray-600">Chức năng "${title}" sẽ có ở giai đoạn tiếp theo</div>
      </div>
    `;
  }

  /* ================= DASHBOARD ================= */
  function renderDashboardPlaceholder() {
    document.getElementById('mainContent').innerHTML = `
      <div class="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
        <div class="card stat-card">
          <div class="stat-label">Tồn đầu ngày</div>
          <div class="stat-value text-gray-800" id="db_tonDau">--</div>
        </div>
        <div class="card stat-card">
          <div class="stat-label">Tổng Thu hôm nay</div>
          <div class="stat-value text-green-600" id="db_thu">--</div>
        </div>
        <div class="card stat-card">
          <div class="stat-label">Tổng Chi hôm nay</div>
          <div class="stat-value text-red-600" id="db_chi">--</div>
        </div>
        <div class="card stat-card">
          <div class="stat-label">Tồn cuối ngày</div>
          <div class="stat-value text-blue-700" id="db_tonCuoi">--</div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="card">
          <div class="text-sm font-semibold text-gray-600 mb-3">Công nợ</div>
          <div class="grid grid-cols-2 gap-3">
            <div class="stat-card">
              <div class="stat-label">Tổng phải thu</div>
              <div class="stat-value text-emerald-600" id="db_phaiThu">--</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Tổng phải trả</div>
              <div class="stat-value text-orange-600" id="db_phaiTra">--</div>
            </div>
          </div>
          <div class="text-xs text-gray-400 mt-3" id="db_quaHan"></div>
        </div>

        <div class="card">
          <div class="text-sm font-semibold text-gray-600 mb-3">Giao dịch hôm nay</div>
          <div class="grid grid-cols-2 gap-3">
            <div class="stat-card">
              <div class="stat-label">Số phiếu Thu</div>
              <div class="stat-value text-green-600" id="db_soPhieuThu">--</div>
            </div>
            <div class="stat-card">
              <div class="stat-label">Số phiếu Chi</div>
              <div class="stat-value text-red-600" id="db_soPhieuChi">--</div>
            </div>
          </div>
        </div>
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4 mb-6">
        <div class="card stat-card">
          <div class="stat-label">Tồn Quỹ Công đoàn</div>
          <div class="stat-value text-indigo-600" id="db_tonQuyCongDoan">--</div>
        </div>
      </div>

      <div class="text-xs text-gray-400 text-right" id="db_ngay"></div>
    `;
  }

  function loadDashboard() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { alert('Lỗi tải Dashboard: ' + res.message); return; }
        const d = res.data;
        document.getElementById('db_tonDau').textContent = formatMoney(d.ton_dau_ngay);
        document.getElementById('db_thu').textContent = formatMoney(d.tong_thu_hom_nay);
        document.getElementById('db_chi').textContent = formatMoney(d.tong_chi_hom_nay);
        document.getElementById('db_tonCuoi').textContent = formatMoney(d.ton_cuoi_ngay);
        document.getElementById('db_phaiThu').textContent = formatMoney(d.tong_phai_thu);
        document.getElementById('db_phaiTra').textContent = formatMoney(d.tong_phai_tra);
        document.getElementById('db_soPhieuThu').textContent = d.so_phieu_thu_hom_nay;
        document.getElementById('db_soPhieuChi').textContent = d.so_phieu_chi_hom_nay;
        document.getElementById('db_quaHan').textContent = d.cong_no_qua_han > 0
          ? '⚠ ' + d.cong_no_qua_han + ' khoản công nợ đã quá hạn'
          : 'Không có công nợ quá hạn';
        document.getElementById('db_tonQuyCongDoan').textContent = formatMoney(d.ton_quy_cong_doan);
        document.getElementById('db_ngay').textContent = 'Dữ liệu tính đến ngày: ' + d.date;
      })
      .withFailureHandler(function (err) {
        alert('Lỗi hệ thống: ' + err.message);
      })
      .getDashboardData();
  }

  /* ================= PHIẾU THU ================= */
  function renderThuForm() {
    document.getElementById('mainContent').innerHTML = `
      <div class="card max-w-2xl">
        <h2 class="text-lg font-semibold mb-4 text-gray-700">Lập Phiếu Thu</h2>
        <div id="thuFormBody" class="text-gray-400 text-sm">Đang tải danh mục...</div>
      </div>
    `;
    getFormOptionsCached(function (data) { renderThuFormBody(data); });
  }

  function renderThuFormBody(opts) {
    const today = _localDateStr(new Date());
    const doiTuongOpts = opts.doiTuong.map(d => `<option value="${d.ma}">${d.ten}</option>`).join('');
    const loaiThuOpts = opts.loaiThu.map(l => `<option value="${l.ma}">${l.ten}</option>`).join('');

    document.getElementById('thuFormBody').innerHTML = `
      <div id="thuMsg" class="hidden mb-4 p-3 rounded-lg text-sm"></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Quỹ</label>
          <select id="thuQuy" onchange="onThuQuyChange()" class="w-full border rounded-lg px-3 py-2">
            <option value="Quỹ tiền mặt">Quỹ tiền mặt</option>
            <option value="Quỹ công đoàn">Quỹ công đoàn</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Loại giao dịch</label>
          <select id="thuLoaiGD" onchange="onThuLoaiGDChange()" class="w-full border rounded-lg px-3 py-2">
            <option value="Thu thường">Thu thường</option>
            <option value="Thu công nợ">Thu công nợ</option>
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Ngày thu (ngày chứng từ)</label>
          <input type="date" id="thuNgay" value="${today}" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Người nộp tiền</label>
          <input type="text" id="thuNguoiNop" placeholder="Tên người nộp tiền" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Đối tượng</label>
          <select id="thuDoiTuong" onchange="onThuDoiTuongChange()" class="w-full border rounded-lg px-3 py-2">
            <option value="">-- Không chọn --</option>
            ${doiTuongOpts}
          </select>
        </div>

        <div class="md:col-span-2 hidden" id="thuCongNoBox">
          <label class="block text-sm font-medium text-gray-600 mb-1">Khoản công nợ cần thu</label>
          <select id="thuCongNo" class="w-full border rounded-lg px-3 py-2">
            <option value="">-- Chọn Đối tượng trước --</option>
          </select>
          <div class="text-xs text-gray-400 mt-1" id="thuCongNoHint"></div>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Loại thu</label>
          <select id="thuLoai" class="w-full border rounded-lg px-3 py-2">
            <option value="">-- Chọn loại thu --</option>
            ${loaiThuOpts}
          </select>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Số tiền</label>
          <input type="number" id="thuSoTien" min="0" step="1000" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Nội dung thu</label>
          <input type="text" id="thuNoiDung" class="w-full border rounded-lg px-3 py-2">
        </div>

        <div class="md:col-span-2 border-t pt-3 mt-1">
          <div class="text-xs font-semibold text-gray-500 uppercase">Thông tin hạch toán Sổ Quỹ (tuỳ chọn)</div>
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Ngày hạch toán</label>
          <input type="date" id="thuNgayHachToan" value="${today}" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Tài khoản</label>
          <input type="text" id="thuTaiKhoan" value="1111" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">TK đối ứng</label>
          <input type="text" id="thuTkDoiUng" placeholder="vd: 7113" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Mã nhân viên</label>
          <input type="text" id="thuMaNhanVien" placeholder="vd: 01.006.001" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Chi nhánh</label>
          <input type="text" id="thuChiNhanh" placeholder="Chi nhánh (nếu có)" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-600 mb-1">Đối soát</label>
          <select id="thuDoiSoat" class="w-full border rounded-lg px-3 py-2">
            <option value="Hoàn ứng" selected>Hoàn ứng</option>
            <option value="Chờ hoàn">Chờ hoàn</option>
          </select>
        </div>

        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Chứng từ liên quan</label>
          <input type="text" id="thuChungTu" placeholder="Link ảnh / mô tả chứng từ" class="w-full border rounded-lg px-3 py-2">
        </div>
        <div class="md:col-span-2">
          <label class="block text-sm font-medium text-gray-600 mb-1">Ghi chú</label>
          <textarea id="thuGhiChu" rows="2" class="w-full border rounded-lg px-3 py-2"></textarea>
        </div>
      </div>
      <div class="flex justify-end mt-4">
        <button id="btnSaveThu" onclick="saveThu()" class="px-5 py-2 rounded-lg bg-green-600 text-white font-medium hover:bg-green-700">💾 Lưu Phiếu Thu</button>
      </div>
    `;
  }

  function onThuLoaiGDChange() {
    const loai = document.getElementById('thuLoaiGD').value;
    const box = document.getElementById('thuCongNoBox');
    if (loai === 'Thu công nợ') {
      box.classList.remove('hidden');
      loadCongNoOptionsForThu();
    } else {
      box.classList.add('hidden');
    }
  }

  // Quỹ Công đoàn không có nghiệp vụ Thu công nợ — ẩn bớt lựa chọn cho gọn.
  function onThuQuyChange() {
    const quy = document.getElementById('thuQuy').value;
    const loaiGDSelect = document.getElementById('thuLoaiGD');
    const congNoOption = loaiGDSelect.querySelector('option[value="Thu công nợ"]');
    if (quy === 'Quỹ công đoàn') {
      loaiGDSelect.value = 'Thu thường';
      if (congNoOption) congNoOption.disabled = true;
      document.getElementById('thuCongNoBox').classList.add('hidden');
    } else if (congNoOption) {
      congNoOption.disabled = false;
    }
  }

  function onThuDoiTuongChange() {
    if (document.getElementById('thuLoaiGD').value === 'Thu công nợ') {
      loadCongNoOptionsForThu();
    }
  }

  function loadCongNoOptionsForThu() {
    const maDoiTuong = document.getElementById('thuDoiTuong').value;
    const select = document.getElementById('thuCongNo');
    const hint = document.getElementById('thuCongNoHint');
    hint.textContent = '';

    if (!maDoiTuong) {
      select.innerHTML = '<option value="">-- Chọn Đối tượng trước --</option>';
      return;
    }
    select.innerHTML = '<option value="">-- Đang tải --</option>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { select.innerHTML = '<option value="">Lỗi tải danh sách</option>'; return; }
        if (res.data.length === 0) {
          select.innerHTML = '<option value="">-- Đối tượng này không có công nợ phải thu --</option>';
          return;
        }
        select.innerHTML = '<option value="">-- Chọn khoản công nợ --</option>' +
          res.data.map(c => `<option value="${c.ma_cong_no}" data-conlai="${c.con_lai}">${c.ma_cong_no} - ${c.noi_dung} (còn ${formatMoney(c.con_lai)})</option>`).join('');
        select.onchange = function () {
          const opt = select.options[select.selectedIndex];
          const conLai = opt.getAttribute('data-conlai');
          hint.textContent = conLai ? 'Còn lại: ' + formatMoney(conLai) : '';
        };
      })
      .withFailureHandler(function () { select.innerHTML = '<option value="">Lỗi hệ thống</option>'; })
      .getCongNoMoOptions(maDoiTuong, 'Phải thu');
  }

  function saveThu() {
    const loaiGD = document.getElementById('thuLoaiGD').value;
    const payload = {
      loai_giao_dich: loaiGD,
      ngay_thu: document.getElementById('thuNgay').value,
      nguoi_nop_tien: document.getElementById('thuNguoiNop').value.trim(),
      ma_doi_tuong: document.getElementById('thuDoiTuong').value,
      ma_cong_no: document.getElementById('thuCongNo').value,
      ma_loai_thu: document.getElementById('thuLoai').value,
      so_tien: document.getElementById('thuSoTien').value,
      noi_dung_thu: document.getElementById('thuNoiDung').value.trim(),
      chung_tu_lien_quan: document.getElementById('thuChungTu').value.trim(),
      ghi_chu: document.getElementById('thuGhiChu').value.trim(),
      loai_quy: document.getElementById('thuQuy').value,
      ngay_hach_toan: document.getElementById('thuNgayHachToan').value,
      tai_khoan: document.getElementById('thuTaiKhoan').value.trim(),
      tk_doi_ung: document.getElementById('thuTkDoiUng').value.trim(),
      ma_nhan_vien: document.getElementById('thuMaNhanVien').value.trim(),
      chi_nhanh: document.getElementById('thuChiNhanh').value.trim(),
      doi_soat: document.getElementById('thuDoiSoat').value
    };

    if (!payload.nguoi_nop_tien) return showFormMsg('thuMsg', 'Vui lòng nhập Người nộp tiền.', true);
    if (!payload.ma_loai_thu) return showFormMsg('thuMsg', 'Vui lòng chọn Loại thu.', true);
    if (!payload.so_tien || Number(payload.so_tien) <= 0) return showFormMsg('thuMsg', 'Số tiền không hợp lệ.', true);
    if (loaiGD === 'Thu công nợ') {
      if (!payload.ma_doi_tuong) return showFormMsg('thuMsg', 'Vui lòng chọn Đối tượng khi Thu công nợ.', true);

  function onChiLoaiGDChange() {
    const loai = document.getElementById('chiLoaiGD').value;

      box.classList.remove('hidden');
      loadCongNoOptionsForChi();
    } else {
      box.classList.add('hidden');
    }

  // Quỹ Công đoàn không có nghiệp vụ Trả công nợ — ẩn bớt lựa chọn cho gọn.
  function onChiQuyChange() {
    const quy = document.getElementById('chiQuy').value;
    const loaiGDSelect = document.getElementById('chiLoaiGD');
    const congNoOption = loaiGDSelect.querySelector('option[value="Trả công nợ"]');
    if (quy === 'Quỹ công đoàn') {
      loaiGDSelect.value = 'Chi thường';
      if (congNoOption) congNoOption.disabled = true;
      document.getElementById('chiCongNoBox').classList.add('hidden');
    } else if (congNoOption) {
      congNoOption.disabled = false;
    }
  }

  function onChiDoiTuongChange() {
    if (document.getElementById('chiLoaiGD').value === 'Trả công nợ') {
      loadCongNoOptionsForChi();
    }
  }

  function loadCongNoOptionsForChi() {
    const maDoiTuong = document.getElementById('chiDoiTuong').value;
    const select = document.getElementById('chiCongNo');
    const hint = document.getElementById('chiCongNoHint');
    hint.textContent = '';

    if (!maDoiTuong) {
      select.innerHTML = '<option value="">-- Chọn Đối tượng trước --</option>';
      return;
    }
    select.innerHTML = '<option value="">-- Đang tải --</option>';

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { select.innerHTML = '<option value="">Lỗi tải danh sách</option>'; return; }
        if (res.data.length === 0) {
          select.innerHTML = '<option value="">-- Đối tượng này không có công nợ phải trả --</option>';
          return;
        }
        select.innerHTML = '<option value="">-- Chọn khoản công nợ --</option>' +
          res.data.map(c => `<option value="${c.ma_cong_no}" data-conlai="${c.con_lai}">${c.ma_cong_no} - ${c.noi_dung} (còn ${formatMoney(c.con_lai)})</option>`).join('');
        select.onchange = function () {
          const opt = select.options[select.selectedIndex];
          const conLai = opt.getAttribute('data-conlai');
          hint.textContent = conLai ? 'Còn lại: ' + formatMoney(conLai) : '';
        };
      })
      .withFailureHandler(function () { select.innerHTML = '<option value="">Lỗi hệ thống</option>'; })
      .getCongNoMoOptions(maDoiTuong, 'Phải trả');
  }

    const loaiGD = document.getElementById('chiLoaiGD').value;
    const payload = {

      ngay_chi: document.getElementById('chiNgay').value,
      nguoi_nhan_tien: document.getElementById('chiNguoiNhan').value.trim(),
      ma_doi_tuong: document.getElementById('chiDoiTuong').value,
      ma_cong_no: document.getElementById('chiCongNo').value,
      ma_loai_chi: document.getElementById('chiLoai').value,
      so_tien: document.getElementById('chiSoTien').value,
      noi_dung_chi: document.getElementById('chiNoiDung').value.trim(),
      chung_tu_lien_quan: document.getElementById('chiChungTu').value.trim(),
      ghi_chu: document.getElementById('chiGhiChu').value.trim(),
      loai_quy: document.getElementById('chiQuy').value,
      ngay_hach_toan: document.getElementById('chiNgayHachToan').value,

      tk_doi_ung: document.getElementById('chiTkDoiUng').value.trim(),

      chi_nhanh: document.getElementById('chiChiNhanh').value.trim(),
      doi_soat: document.getElementById('chiDoiSoat').value
    };

    if (!payload.nguoi_nhan_tien) return showFormMsg('chiMsg', 'Vui lòng nhập Người nhận tiền.', true);
    if (!payload.ma_loai_chi) return showFormMsg('chiMsg', 'Vui lòng chọn Loại chi.', true);
    if (!payload.so_tien || Number(payload.so_tien) <= 0) return showFormMsg('chiMsg', 'Số tiền không hợp lệ.', true);
    if (loaiGD === 'Trả công nợ') {
      if (!payload.ma_doi_tuong) return showFormMsg('chiMsg', 'Vui lòng chọn Đối tượng khi Trả công nợ.', true);
      if (!payload.ma_cong_no) return showFormMsg('chiMsg', 'Vui lòng chọn Khoản công nợ cần trả.', true);
    }

    const btn = document.getElementById('btnSaveChi');
    btn.disabled = true;
    btn.textContent = '⏳ Đang lưu...';

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = '💾 Lưu Phiếu Chi';
        if (!res.success) { showFormMsg('chiMsg', res.message, true); return; }
        const soPhieu = res.data.so_phieu_chi;
        renderChiForm();
        setTimeout(function () {
          if (document.getElementById('chiMsg')) showFormMsg('chiMsg', 'Đã lưu phiếu chi ' + soPhieu + ' thành công!', false);
        }, 300);
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '💾 Lưu Phiếu Chi';
        showFormMsg('chiMsg', 'Lỗi hệ thống: ' + err.message, true);
      })
      .addPhieuChi(payload, currentUserInfo());
  }

  function loadSoDoiSoat() {
    const filters = _doiSoatFiltersHienTai();
    const coQuyenDoi = ['ADMIN', 'THU_QUY'].indexOf(CURRENT_USER.role) !== -1;

    document.getElementById('doiSoatBody').innerHTML = '<tr><td colspan="9" class="py-6 text-center text-gray-400">Đang tải...</td></tr>';

    google.script.run
      .withSuccessHandler(function (res) {

        const d = res.data;
        document.getElementById('ds_soLuong').textContent = d.so_luong_cho_hoan.toLocaleString('vi-VN');
        document.getElementById('ds_tongTien').textContent = formatMoney(d.tong_tien_cho_hoan);

        const body = document.getElementById('doiSoatBody');
        if (!d.danh_sach || d.danh_sach.length === 0) {
          body.innerHTML = '<tr><td colspan="9" class="py-6 text-center text-gray-400">Không có chứng từ nào khớp bộ lọc.</td></tr>';
          return;
        }
        body.innerHTML = d.danh_sach.map(function (t) {
          const soTien = t.thu || t.chi;
          const trangThaiKhac = t.doi_soat === 'Chờ hoàn' ? 'Hoàn ứng' : 'Chờ hoàn';
          const nutDoi = coQuyenDoi
            ? '<button onclick="doiTrangThaiDoiSoat(\'' + t.so_phieu + '\',\'' + t.loai + '\',\'' + trangThaiKhac + '\')" class="text-blue-600 text-xs hover:underline">Đổi thành "' + trangThaiKhac + '"</button>'

            '<td class="py-2 pr-3 font-medium">' + t.so_phieu + '</td>' +

  function xemChiTietCongNo(maDoiTuong) {
    if (!BAOCAO_CONGNO_DATA) return;
    const rowInfo = BAOCAO_CONGNO_DATA.list.find(function (r) { return r.ma_doi_tuong === maDoiTuong; });
    const tenDoiTuong = rowInfo ? rowInfo.doi_tuong : maDoiTuong;

    const wrap = document.getElementById('bccnChiTietWrap');
    const title = document.getElementById('bccnChiTietTitle');
    const body = document.getElementById('bccnChiTietBody');
    title.textContent = 'Chi tiết công nợ - ' + tenDoiTuong;
    body.textContent = 'Đang tải...';
    wrap.classList.remove('hidden');

    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { body.textContent = 'Lỗi: ' + res.message; return; }
        const d = res.data;
        let html = '<div class="mb-3 text-sm">Đầu kỳ: <b>' + formatMoney(d.dau_ky) + '</b> &nbsp;|&nbsp; Cuối kỳ: <b>' + formatMoney(d.cuoi_ky) + '</b></div>';

        html += '<div class="font-medium text-gray-600 text-sm mb-1">Phát sinh trong kỳ</div>';
        if (d.phat_sinh.length === 0) {
          html += '<div class="text-xs text-gray-400 mb-3">Không có</div>';
        } else {
          html += '<table class="w-full text-xs mb-3"><tbody>' + d.phat_sinh.map(function (x) {
            return '<tr class="border-b"><td class="py-1 pr-2">' + x.ngay + '</td><td class="py-1 pr-2">' + x.ma_cong_no + '</td><td class="py-1 pr-2">' + (x.noi_dung || '') + '</td><td class="py-1 text-right">' + formatMoney(x.so_tien) + '</td></tr>';
          }).join('') + '</tbody></table>';
        }

        html += '<div class="font-medium text-gray-600 text-sm mb-1">Thanh toán trong kỳ</div>';
        if (d.thanh_toan.length === 0) {
          html += '<div class="text-xs text-gray-400">Không có</div>';
        } else {
          html += '<table class="w-full text-xs"><tbody>' + d.thanh_toan.map(function (x) {
            return '<tr class="border-b"><td class="py-1 pr-2">' + x.ngay + '</td><td class="py-1 pr-2">' + x.loai + ' - ' + x.so_phieu + '</td><td class="py-1 text-right">' + formatMoney(x.so_tien) + '</td></tr>';
          }).join('') + '</tbody></table>';
        }

        body.innerHTML = html;
      })
      .withFailureHandler(function (err) { body.textContent = 'Lỗi hệ thống: ' + err.message; })
      .getBaoCaoCongNoChiTiet(maDoiTuong, BAOCAO_CONGNO_DATA.loai, BAOCAO_CONGNO_DATA.tuNgay, BAOCAO_CONGNO_DATA.denNgay);
  }

  function addUser() {
    const payload = {
      username: document.getElementById('nuUsername').value.trim(),
      password: document.getElementById('nuPassword').value,
      full_name: document.getElementById('nuFullName').value.trim(),
      role: document.getElementById('nuRole').value
    };

    if (!payload.username) return showFormMsg('addUserMsg', 'Vui lòng nhập Tên đăng nhập.', true);
    if (!payload.password || payload.password.length < 6) return showFormMsg('addUserMsg', 'Mật khẩu tối thiểu 6 ký tự.', true);
    if (!payload.full_name) return showFormMsg('addUserMsg', 'Vui lòng nhập Họ tên.', true);

    const btn = document.getElementById('btnAddUser');
    btn.disabled = true;
    btn.textContent = '⏳ Đang tạo...';

    google.script.run
      .withSuccessHandler(function (res) {
        btn.disabled = false;
        btn.textContent = '💾 Tạo tài khoản';
        if (!res.success) { showFormMsg('addUserMsg', res.message, true); return; }
        showFormMsg('addUserMsg', 'Đã tạo tài khoản ' + payload.username + '!', false);
        loadUserList();
      })
      .withFailureHandler(function (err) {
        btn.disabled = false;
        btn.textContent = '💾 Tạo tài khoản';
        showFormMsg('addUserMsg', 'Lỗi hệ thống: ' + err.message, true);
      })
      .addUserByAdmin(payload, currentUserInfo());
  }

  function loadUserList() {
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { alert('Lỗi: ' + res.message); return; }
        const body = document.getElementById('userListBody');
        body.innerHTML = res.data.map(function (u) {
          const isSelf = u.username === CURRENT_USER.username;
          return '<tr class="border-b hover:bg-gray-50">' +
            '<td class="py-2 pr-3 font-medium">' + u.username + (isSelf ? ' <span class="text-xs text-gray-400">(bạn)</span>' : '') + '</td>' +
            '<td class="py-2 pr-3">' + u.full_name + '</td>' +
            '<td class="py-2 pr-3">' + u.role + '</td>' +
            '<td class="py-2 pr-3"><span class="px-2 py-0.5 rounded-full text-xs font-medium ' + (u.status === 'Hoạt động' ? 'bg-green-100 text-green-700' : 'bg-gray-200 text-gray-500') + '">' + u.status + '</span></td>' +
            '<td class="py-2 pr-3">' + (isSelf ? '' : '<button onclick="toggleUserStatus(\'' + u.username + '\')" class="text-blue-600 text-xs hover:underline">' + (u.status === 'Hoạt động' ? 'Khóa' : 'Mở khóa') + '</button>') + '</td>' +

  function saveDoiTuong() {
    const maDoiTuong = document.getElementById('dtMaDoiTuong').value;
    const isEdit = !!maDoiTuong;

    const payload = {
      ma_doi_tuong: maDoiTuong,
      ten_doi_tuong: document.getElementById('dtTen').value.trim(),
      loai_doi_tuong: document.getElementById('dtLoai').value,
      so_dien_thoai: document.getElementById('dtSdt').value.trim(),
      mst: document.getElementById('dtMst').value.trim(),
      dia_chi: document.getElementById('dtDiaChi').value.trim(),
      nguoi_lien_he: document.getElementById('dtNguoiLienHe').value.trim(),
      ghi_chu: document.getElementById('dtGhiChu').value.trim(),
      trang_thai: document.getElementById('dtTrangThai').value
    };

    if (!payload.ten_doi_tuong) return showFormMsg('dtMsg', 'Vui lòng nhập Tên đối tượng.', true);

    const btn = document.getElementById('btnSaveDoiTuong');
    btn.disabled = true;
    btn.textContent = '⏳ Đang lưu...';

    const callback = function (res) {
      btn.disabled = false;
      btn.textContent = '💾 Lưu';
      if (!res.success) { showFormMsg('dtMsg', res.message, true); return; }
      huyDoiTuongForm();
      loadDoiTuongList();
      CACHED_FORM_OPTIONS = null; // buộc tải lại danh mục vì vừa có thay đổi
    };
    const failCallback = function (err) {
      btn.disabled = false;
      btn.textContent = '💾 Lưu';
      showFormMsg('dtMsg', 'Lỗi hệ thống: ' + err.message, true);
    };

    if (isEdit) {
      google.script.run.withSuccessHandler(callback).withFailureHandler(failCallback).updateDoiTuong(payload, currentUserInfo());
    } else {
      google.script.run.withSuccessHandler(callback).withFailureHandler(failCallback).addDoiTuong(payload, currentUserInfo());
    }
  }

      trangThai: document.getElementById('dt_trangThai') ? document.getElementById('dt_trangThai').value : '',
      tuKhoa: document.getElementById('dt_tuKhoa') ? document.getElementById('dt_tuKhoa').value.trim() : ''
    };
    document.getElementById('doiTuongBody').innerHTML = '<tr><td colspan="6" class="py-6 text-center text-gray-400">Đang tải...</td></tr>';

  function suaDanhMuc(ma, ten, trangThai) {
    document.getElementById('dmFormWrap').classList.remove('hidden');
    document.getElementById('dmFormTitle').textContent = 'Sửa danh mục: ' + ma;
    document.getElementById('dmMa').value = ma;
    document.getElementById('dmTen').value = ten;
    document.getElementById('dmTrangThaiBox').classList.remove('hidden');
    document.getElementById('dmTrangThai').value = trangThai;
    document.getElementById('dmMsg').classList.add('hidden');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function saveDanhMuc() {
    const ma = document.getElementById('dmMa').value;
    const ten = document.getElementById('dmTen').value.trim();
    const trangThai = document.getElementById('dmTrangThai').value;

    if (!ten) return showFormMsg('dmMsg', 'Vui lòng nhập Tên danh mục.', true);

    const btn = document.getElementById('btnSaveDanhMuc');
    btn.disabled = true;
    btn.textContent = '⏳ Đang lưu...';

    const callback = function (res) {
      btn.disabled = false;
      btn.textContent = '💾 Lưu';
      if (!res.success) { showFormMsg('dmMsg', res.message, true); return; }
      document.getElementById('dmFormWrap').classList.add('hidden');
      loadDanhMucList();
      CACHED_FORM_OPTIONS = null;
    };
    const failCallback = function (err) {
      btn.disabled = false;
      btn.textContent = '💾 Lưu';
      showFormMsg('dmMsg', 'Lỗi hệ thống: ' + err.message, true);
    };

    if (ma) {
      google.script.run.withSuccessHandler(callback).withFailureHandler(failCallback).updateDanhMuc(DANHMUC_TAB, ma, ten, trangThai, currentUserInfo());
    } else {
      google.script.run.withSuccessHandler(callback).withFailureHandler(failCallback).addDanhMuc(DANHMUC_TAB, ten, currentUserInfo());
    }
  }

   * toán: không sửa/xóa phiếu cũ, chỉ đổi trạng thái + ghi lý do, giữ
   * nguyên lịch sử. Nếu phiếu là Thu/Trả công nợ, backend tự hoàn tác
   * lại khoản công nợ liên quan.
   */
  function huyPhieuTraCuu(soPhieu, loai) {
    const lyDo = prompt('Nhập lý do hủy phiếu ' + soPhieu + ':');
    if (lyDo === null) return; // bấm Hủy (Cancel) hộp thoại
    if (!lyDo.trim()) { alert('Vui lòng nhập lý do hủy.'); return; }

    const hamGoi = loai === 'Thu' ? 'huyPhieuThu' : 'huyPhieuChi';
    google.script.run
      .withSuccessHandler(function (res) {
        if (!res.success) { alert('Lỗi: ' + res.message); return; }
        alert('Đã hủy phiếu ' + soPhieu + '.');
        xemChiTietGiaoDich(soPhieu, loai);
        loadTraCuu();
      })
      .withFailureHandler(function (err) { alert('Lỗi hệ thống: ' + err.message); })
      [hamGoi](soPhieu, lyDo.trim(), currentUserInfo());
  }

  function formatMoney(n) {
    n = Number(n) || 0;
    return n.toLocaleString('vi-VN') + ' đ';

  function formatTan(n) {
    n = Number(n) || 0;
    return n.toLocaleString('vi-VN', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }

  /**
   * Đổi 1 số tiền (VNĐ, số nguyên) thành chữ tiếng Việt, dùng để in
   * lên mẫu Phiếu Thu/Phiếu Chi ("Viết bằng chữ: ..."). Không xử lý
   * phần thập phân (tiền VNĐ trong hệ thống luôn là số nguyên).
   */
  function soTienBangChu(soTien) {
    soTien = Math.round(Number(soTien) || 0);
    if (soTien === 0) return 'Không đồng.';
    const amNhat = soTien < 0;
    soTien = Math.abs(soTien);

    const chuSo = ['không', 'một', 'hai', 'ba', 'bốn', 'năm', 'sáu', 'bảy', 'tám', 'chín'];
    const donViNhom = ['', 'nghìn', 'triệu', 'tỷ'];

    function docBaSo(so, canKhongTram) {
      const tram = Math.floor(so / 100);
      const chuc = Math.floor((so % 100) / 10);
      const donvi = so % 10;
      let s = '';
      if (tram > 0) s += chuSo[tram] + ' trăm ';
      else if (canKhongTram) s += 'không trăm ';

      if (chuc === 0) {
        if (donvi > 0) s += (tram > 0 || canKhongTram ? 'lẻ ' : '') + chuSo[donvi] + ' ';
      } else if (chuc === 1) {
        s += 'mười ';
        if (donvi === 5) s += 'lăm ';
        else if (donvi > 0) s += chuSo[donvi] + ' ';
      } else {
        s += chuSo[chuc] + ' mươi ';
        if (donvi === 1) s += 'mốt ';
        else if (donvi === 5) s += 'lăm ';
        else if (donvi > 0) s += chuSo[donvi] + ' ';
      }
      return s.trim();
    }

    const nhom = [];
    let n = soTien;
    while (n > 0) { nhom.push(n % 1000); n = Math.floor(n / 1000); }

    const parts = [];
    for (let i = nhom.length - 1; i >= 0; i--) {
      const g = nhom[i];
      if (g === 0) continue;
      const canKhongTram = i !== nhom.length - 1 && Math.floor(g / 100) === 0;
      let groupText = docBaSo(g, canKhongTram);
      if (donViNhom[i]) groupText += ' ' + donViNhom[i];
      parts.push(groupText.trim());
    }

    let result = parts.join(' ').replace(/\s+/g, ' ').trim();
    result = result.charAt(0).toUpperCase() + result.slice(1);
    return (amNhat ? 'Âm ' + result.toLowerCase() : result) + ' đồng chẵn.';
  }

  function showFormMsg(boxId, text, isError) {

    if (!box) return;

  /**
   * Nhận file .xlsx dạng base64 từ server (xem XuatExcel.gs) và cho
   * trình duyệt tải xuống trực tiếp — file Excel THẬT (có định dạng,
   * màu sắc, số tiền căn phải...), không phải CSV thô.
   */
  function taiFileExcel(base64, filename) {
    const byteChars = atob(base64);
    const byteNumbers = new Array(byteChars.length);
    for (let i = 0; i < byteChars.length; i++) byteNumbers[i] = byteChars.charCodeAt(i);
    const byteArray = new Uint8Array(byteNumbers);
    const blob = new Blob([byteArray], { type: 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet' });
    const link = document.createElement('a');
    link.href = URL.createObjectURL(blob);
    link.download = filename;
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
    URL.revokeObjectURL(link.href);
  }

  /**
   * Gọi 1 hàm server sinh file Excel, disable nút bấm trong lúc chờ
   * (việc tạo + xuất Google Sheet mất vài giây), rồi tự tải file về.
   */
  function xuatExcelTuServer(btn, tenHamServer, thamSo) {
    const textCu = btn.textContent;
    btn.disabled = true;
    btn.textContent = '⏳ Đang tạo file...';

    const xongRoi = function () { btn.disabled = false; btn.textContent = textCu; };

    let call = google.script.run
      .withSuccessHandler(function (res) {
        xongRoi();
        if (!res.success) { alert('Lỗi: ' + res.message); return; }
        taiFileExcel(res.data.base64, res.data.filename);
      })
      .withFailureHandler(function (err) {
        xongRoi();
        alert('Lỗi hệ thống: ' + err.message);
      });
    call[tenHamServer].apply(call, thamSo || []);
  }

      _hdP('Bấm "+ Thêm người dùng" để tạo tài khoản (Tên đăng nhập, Mật khẩu ≥ 6 ký tự, Họ tên, Vai trò). Có thể Khóa/Mở khóa từng tài khoản (trừ tài khoản đang đăng nhập).') +
      _hdH('Nhật ký hệ thống') +

      _hdNote('Tài khoản Google đứng tên deploy web app phải có quyền Xem (Viewer) trên cả 2 Google Sheet nguồn thì mới đọc được dữ liệu.'),

      [
