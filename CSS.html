<style>
  /* ---------- BẢNG MÀU ĐỒNG BỘ VỚI MAIN_HAK (HAK Portal) ---------- */
  :root {
    --hak-sidebar-bg: #1f2937;
    --hak-sidebar-hover: #2d3a4d;
    --hak-primary: #2563eb;
    --hak-primary-hover: #1d4ed8;
    --hak-sidebar-text: #cbd5e1;
    --hak-sidebar-dim: #8b98ab;
    --hak-bg: #f3f4f6;
    --hak-card: #ffffff;
    --hak-border: #e5e7eb;
    --hak-text: #111827;
    --hak-muted: #6b7280;
    --hak-danger: #dc2626;
    --hak-warn: #b45309;
    --hak-thu: #15803d;
    --hak-chi: #b91c1c;
  }
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    background: var(--hak-bg);
    color: var(--hak-text);
    margin: 0;
  }

  /* ---------- Màn hình đăng nhập ---------- */
  #loginScreen {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: var(--hak-bg);
  }
  #loginBox {
    background: var(--hak-card);
    border: 1px solid var(--hak-border);
    border-top: 4px solid var(--hak-primary);
    border-radius: 10px;
    padding: 36px;
    width: 100%;
    max-width: 400px;
    box-shadow: 0 10px 30px rgba(17,24,39,0.08);
  }
  #btnLogin { background: var(--hak-primary) !important; }
  #btnLogin:hover { background: var(--hak-primary-hover) !important; }

  /* ---------- Layout chính (giống MAIN_HAK) ---------- */
  #appShell { display: none; min-height: 100vh; }
  #sidebar {
    width: 260px;
    background: var(--hak-sidebar-bg);
    color: var(--hak-sidebar-text);
    flex-shrink: 0;
    transition: transform 0.2s ease;
  }
  .sb-header { padding: 20px 20px 18px; border-bottom: 1px solid rgba(255,255,255,0.08); margin-bottom: 8px; }
  .sb-header .sb-title { font-size: 17px; font-weight: 700; color: #fff; }
  .sb-header .sb-sub { font-size: 12px; color: var(--hak-sidebar-dim); margin-top: 2px; }
  .menu-item {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 11px 20px;
    cursor: pointer;
    font-size: 13.5px;
    font-weight: 600;
    border-left: 3px solid transparent;
    color: var(--hak-sidebar-text);
    transition: background 0.15s;
  }
  .menu-item:hover { background: var(--hak-sidebar-hover); }
  .menu-item.active {
    background: var(--hak-sidebar-hover);
    border-left-color: var(--hak-primary);
    color: #fff;
  }

  .topbar {
    height: 52px; flex-shrink: 0;
    background: var(--hak-card);
    border-bottom: 1px solid var(--hak-border);
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
  }
  #pageTitle { font-size: 15px; font-weight: 700; color: var(--hak-text); }

  #mainContent { flex: 1; padding: 24px; }

  .card {
    background: var(--hak-card);
    border: 1px solid var(--hak-border);
    border-radius: 10px;
    padding: 20px;
  }

  .stat-card { text-align: center; }
  .stat-label { font-size: 12px; color: var(--hak-muted); margin-bottom: 4px; }
  .stat-value { font-size: 22px; font-weight: 700; }

  /* Bảng dữ liệu: tiêu đề cột thống nhất */
  #mainContent table thead th {
    color: var(--hak-muted); font-weight: 600; font-size: 12.5px;
    background: #f9fafb; border-bottom: 1px solid var(--hak-border);
    padding-top: 9px; padding-bottom: 9px;
  }
  #mainContent table thead th:first-child { padding-left: 10px; }
  #mainContent table tbody td:first-child { padding-left: 10px; }
  #mainContent table tbody tr { border-color: var(--hak-border); }

  /* Nút chính dùng màu nhấn của MAIN_HAK */
  .bg-blue-600 { background-color: var(--hak-primary) !important; }
  .hover\:bg-blue-700:hover { background-color: var(--hak-primary-hover) !important; }
  .bg-gray-800 { background-color: var(--hak-sidebar-bg) !important; }
  .hover\:bg-gray-900:hover { background-color: var(--hak-sidebar-hover) !important; }

  ::-webkit-scrollbar { width: 6px; height: 6px; }
  ::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }

  @media (max-width: 768px) {
    #sidebar {
      position: fixed;
      z-index: 40;
      height: 100%;
      transform: translateX(-100%);
    }
    #sidebar.open { transform: translateX(0); }
  }


  /* ---------- Ô nhập liệu: chữ ĐẬM, RÕ (tránh bị mờ do kế thừa màu xám
     từ khung chứa) — áp dụng cho mọi form trong hệ thống ---------- */
  input, select, textarea {
    color: #111827 !important;
    background-color: #fff;
  }
  input::placeholder, textarea::placeholder { color: #9ca3af !important; font-weight: 400; }
  input:disabled, select:disabled, textarea:disabled { background: #f3f4f6; color: #4b5563 !important; }

  /* ---------- Căn lề chuẩn: số phải, chữ trái, ngày giữa ---------- */
  .al-num  { text-align: right !important; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .al-text { text-align: left !important; }
  .al-date { text-align: center !important; white-space: nowrap; }
  input.al-num { text-align: right !important; }
  input.al-date { text-align: center !important; }

  /* ---------- Ô ngày dd/mm/yyyy (thay cho input type=date phụ thuộc
     ngôn ngữ trình duyệt) ---------- */
  .vn-date-wrap { position: relative; display: block; width: 100%; }
  .vn-date-wrap > input[data-vn-date] { padding-right: 34px !important; text-align: center; }
  .vn-date-btn {
    position: absolute; right: 4px; top: 50%; transform: translateY(-50%);
    border: 0; background: transparent; cursor: pointer; font-size: 15px;
    padding: 2px 6px; line-height: 1; border-radius: 6px;
  }
  .vn-date-btn:hover { background: #f3f4f6; }
  .vn-date-picker {
    position: absolute; right: 0; bottom: 0; width: 1px; height: 1px;
    opacity: 0; pointer-events: none; border: 0; padding: 0;
  }
  input[data-vn-date].vn-date-loi { border-color: #dc2626 !important; background: #fef2f2; }

  /* ---------- Form lập Phiếu Thu / Phiếu Chi (theo bảng màu MAIN_HAK) ---------- */
  .pf-card, .pf-card *, .vn-date-wrap, .vn-date-wrap * { box-sizing: border-box; }
  .pf-card { max-width: 920px; padding: 0; overflow: hidden; }
  .pf-head {
    padding: 16px 22px; display: flex; justify-content: space-between; align-items: center; gap: 12px;
    border-bottom: 1px solid var(--hak-border); border-left: 4px solid var(--hak-primary);
  }
  .pf-head.thu { border-left-color: var(--hak-thu); }
  .pf-head.chi { border-left-color: var(--hak-chi); }
  .pf-head-left { display: flex; align-items: center; gap: 12px; }
  .pf-badge {
    width: 40px; height: 40px; border-radius: 8px; display: flex; align-items: center; justify-content: center;
    font-weight: 800; font-size: 13px; letter-spacing: .03em; color: #fff;
  }
  .pf-head.thu .pf-badge { background: var(--hak-thu); }
  .pf-head.chi .pf-badge { background: var(--hak-chi); }
  .pf-head h2 { font-size: 17px; font-weight: 700; margin: 0; color: var(--hak-text); }
  .pf-head .pf-sub { font-size: 12.5px; color: var(--hak-muted); margin-top: 2px; }
  .pf-head-btn {
    font-size: 12.5px; color: #374151; border: 1px solid var(--hak-border); border-radius: 6px;
    padding: 6px 12px; background: #fafafa; cursor: pointer; white-space: nowrap;
  }
  .pf-head-btn:hover { background: #f0f0f0; }
  .pf-body { padding: 20px 22px 0; }
  .pf-sec { margin-bottom: 20px; }
  .pf-sec-title {
    display: flex; align-items: center; gap: 8px; font-size: 12.5px; font-weight: 700;
    text-transform: uppercase; letter-spacing: .04em; color: #374151;
    padding-bottom: 8px; margin-bottom: 12px; border-bottom: 1px solid var(--hak-border);
  }
  .pf-sec-num {
    width: 20px; height: 20px; border-radius: 50%; background: var(--hak-sidebar-bg); color: #fff;
    font-size: 11px; display: inline-flex; align-items: center; justify-content: center;
  }
  .pf-grid { display: grid; grid-template-columns: 1fr; gap: 14px 18px; }
  @media (min-width: 768px) { .pf-grid { grid-template-columns: 1fr 1fr; } .pf-span2 { grid-column: span 2; } }
  @media (min-width: 1024px) { .pf-grid.pf-grid3 { grid-template-columns: 1fr 1fr 1fr; } }
  .pf-label { display: block; font-size: 13px; font-weight: 600; color: #374151; margin-bottom: 5px; }
  .pf-label .req { color: var(--hak-danger); margin-left: 2px; }
  .pf-input {
    width: 100%; height: 40px; border: 1px solid #d1d5db; border-radius: 6px; padding: 0 12px;
    font-size: 14.5px; font-weight: 500; color: var(--hak-text); background: #fff;
    transition: border-color .15s, box-shadow .15s;
  }
  textarea.pf-input { height: auto; padding: 9px 12px; resize: vertical; }
  .pf-input:hover { border-color: #9ca3af; }
  .pf-input:focus { outline: none; border-color: var(--hak-primary); box-shadow: 0 0 0 3px rgba(37,99,235,.15); }
  .pf-money-box {
    border: 1px solid var(--hak-border); background: #f9fafb; border-radius: 8px; padding: 12px 14px;
  }
  .pf-money-wrap { position: relative; }
  .pf-money { height: 48px; font-size: 22px; font-weight: 700; text-align: right; padding-right: 40px; letter-spacing: .02em; }
  .pf-money-unit { position: absolute; right: 14px; top: 50%; transform: translateY(-50%); font-weight: 700; color: var(--hak-muted); }
  .pf-bang-chu { font-size: 12.5px; color: #374151; font-style: italic; margin-top: 6px; min-height: 18px; }
  .pf-hint { font-size: 12px; color: var(--hak-muted); margin-top: 4px; }
  .pf-sec details > summary { cursor: pointer; list-style: none; }
  .pf-sec details > summary::-webkit-details-marker { display: none; }
  .pf-sec details > summary .pf-toggle { margin-left: auto; font-weight: 600; text-transform: none; letter-spacing: 0; color: var(--hak-primary); font-size: 12.5px; }
  .pf-sec details[open] > summary .pf-toggle-open { display: inline; }
  .pf-sec details[open] > summary .pf-toggle-closed, .pf-sec details:not([open]) > summary .pf-toggle-open { display: none; }
  .pf-actions {
    display: flex; justify-content: space-between; align-items: center; gap: 10px;
    margin: 4px -22px 0; padding: 14px 22px; background: #f9fafb; border-top: 1px solid var(--hak-border);
  }
  .pf-actions .pf-note { font-size: 12.5px; color: var(--hak-muted); }
  .pf-btn { padding: 9px 18px; border-radius: 6px; font-weight: 600; font-size: 14px; cursor: pointer; border: 1px solid transparent; }
  .pf-btn-sub { border-color: #d1d5db; color: #374151; background: #fff; }
  .pf-btn-sub:hover { background: #f3f4f6; }
  .pf-btn-main { background: var(--hak-primary); color: #fff; }
  .pf-btn-main:hover { background: var(--hak-primary-hover); }
  .pf-btn-main:disabled { opacity: .6; cursor: wait; }

  /* ---------- Khi In (Ctrl+P) / Xuất PDF từ trình duyệt ---------- */
  /* Class "no-print" đặt trên nút bấm/bộ lọc để ẩn khi in, chỉ giữ lại bảng báo cáo */
  @media print {
    #sidebar, .no-print { display: none !important; }
    #appShell .topbar { display: none !important; } /* thanh trên cùng */
    #mainContent { padding: 0 !important; }
    body { background: #fff !important; }
    .card { box-shadow: none !important; border: 1px solid #e5e7eb; }
  }
</style>
